[/Script/MarineDemolition.MD_ComfortSettings]
; Comfort - 3D 멀미 완화. 코드 기본값보다 이 값이 우선한다.
; 시야 응답 커브는 체감 비교 후 껐다(1.0 = 완전 패스스루). 감도가 무겁게 느껴졌다.
LookResponseExponent=1.000000
; 위 지수가 1.0인 동안은 무효값이다. 커브를 다시 켤 때 과하게 걸리지 않도록
; 실측한 프레임당 입력 규모(0.3 내외)에 맞춰 남겨둔다. 코드 기본값 4.0은 10배쯤 과했다.
LookResponseReferenceDelta=0.400000
; 부드러움을 담당하는 실제 항목. 0.04 -> 0.06 -> 0.03 순으로 체감 비교해 0.03으로 정했다.
; 0.06은 조작이 무겁게 느껴졌다. 값을 올리면 부드러워지는 대신 입력 지연이 커지고,
; 지연은 멀미를 늘리는 방향이므로 더 올릴 때는 그 점을 감안할 것.
LookSmoothingHalfLife=0.030000


