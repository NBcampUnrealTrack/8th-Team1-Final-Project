; MegaLights values follow ShadowQuality like BaseScalability.ini. A section only sets its own keys and never
; resets the others, so every level spells out LightAttenuationFalloff and EvaluateMaterialMode explicitly.
; @0..@3 keep the engine Epic values (Falloff 0.18); masked-material evaluation stays on from @3.
[ShadowQuality@0]
r.MegaLights.LightAttenuationFalloff=0.18
r.MegaLights.HardwareRayTracing.EvaluateMaterialMode=0

[ShadowQuality@1]
r.MegaLights.LightAttenuationFalloff=0.18
r.MegaLights.HardwareRayTracing.EvaluateMaterialMode=0

[ShadowQuality@2]
r.MegaLights.LightAttenuationFalloff=0.18
r.MegaLights.HardwareRayTracing.EvaluateMaterialMode=0

; Preserve Epic shadow resolution while keeping headroom above measured Ocean portal demand.
; The tighter 2048-page trial peaked at 1565 resident pages with no overflow; retain 3072.
[ShadowQuality@3]
r.Shadow.Virtual.MaxPhysicalPages=3072
r.MegaLights.DownsampleMode=2
r.MegaLights.LightAttenuationFalloff=0.18
r.MegaLights.HardwareRayTracing.EvaluateMaterialMode=1

; Cinematic keeps the previous project-wide look: full-resolution MegaLights and conservative falloff.
[ShadowQuality@Cine]
r.MegaLights.DownsampleMode=0
r.MegaLights.LightAttenuationFalloff=1.0
r.MegaLights.HardwareRayTracing.EvaluateMaterialMode=1

; Hardware ray tracing for Lumen stays only at Epic and Cinematic. The cvar is global, so Lumen reflections
; switch to software too. GI@0 has no Lumen GI; BaseScalability disables mesh-SDF tracing at GI@1/@2, so
; software Lumen there traces the global distance field only. Check GI and water reflections at High.
; Every level is listed because a value set by @0..@2 would otherwise stick after switching to @3.
; MD_GraphicsSettingCategory also turns r.RayTracing.Enable off at GI <= 2 unless MegaLights is requested
; (r.MegaLights.EnableForProject or an enabled post-process volume), re-checked after every map load.
[GlobalIlluminationQuality@0]
r.Lumen.HardwareRayTracing=0

[GlobalIlluminationQuality@1]
r.Lumen.HardwareRayTracing=0

[GlobalIlluminationQuality@2]
r.Lumen.HardwareRayTracing=0

[GlobalIlluminationQuality@3]
r.Lumen.HardwareRayTracing=1

[GlobalIlluminationQuality@Cine]
r.Lumen.HardwareRayTracing=1
