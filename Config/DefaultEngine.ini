[/Script/Engine.PhysicsSettings]
; 헤라 긁기가 히트 지점의 메시 UV를 canonical 셀 주소로 사용한다.
; UGameplayStatics::FindCollisionUV가 동작하려면 cooked triangle mesh가
; 삼각형별 UV를 보관해야 하므로 이 설정이 필수다.
bSupportUVFromHitResults=True

[Zen.AutoLaunch]
; Keep the shared local DDC server warm across Editor restarts.
; Loading 1000 persisted Zen sessions took 11.7s on the profiling machine.
; The cache stays usable by other projects; no cache data or quality is removed.
LimitProcessLifetime=False

[/Script/Engine.EditorStreamingSettings]
; Without this early setting, Editor RequestAsyncLoad still serializes on the game thread.
s.AsyncLoadingThreadEnabled=True

; ─────────────────────────────────────────────────────────────────────────────
; Multi-User Editing (Concert) — VPN 공용 튜닝
; 기본값 그대로 두면 VPN에서 세션이 끊긴다. 근거는
; Docs/MultiUser/멀티유저 편집 운영 규칙.md 참고.
;
; 여기에는 "어느 경로로 접속하든 같은" 값만 둔다.
; UnicastEndpoint / StaticEndpoints 는 머신·경로마다 다르므로 넣지 않는다 —
; 런처가 Saved/Config/WindowsEditor/Engine.ini (gitignore) 로 주입한다.
; 호스트 주소는 Tools/MultiUser/host.json 한 곳에서만 관리한다.
; ─────────────────────────────────────────────────────────────────────────────
[/Script/UdpMessaging.UdpMessagingSettings]
EnableTransport=True

; Tailscale 은 멀티캐스트를 나르지 않으므로 자동 탐색이 불가능하다.
; 값은 전원 동일해야 하지만, 실제 접속은 아래 StaticEndpoints 가 담당한다.
MulticastEndpoint=230.0.0.1:6666
MulticastTimeToLive=1

; 호스트(맥미니)의 Tailscale 주소. Tools/MultiUser/host.json 의 hostAddress 와
; 항상 같은 값이어야 한다 — 호스트가 바뀌면 두 곳 다 고친다.
;
; 여기 두는 이유: 에디터가 Saved/Config/<플랫폼>Editor/Engine.ini 를 시작할 때
; 통째로 덮어쓴다. 런처가 거기 써넣어도 읽히기 전에 날아간다. 반면 이 파일은
; 프로젝트 설정이라 에디터가 건드리지 않는다.
; 호스트 주소는 머신마다 다르지 않으므로 공유 파일에 둬도 문제없다.
+StaticEndpoints=100.77.222.84:50002

; 기본값 1.0 = 1Gbit/s. VPN 업링크를 즉시 포화시켜 에셋 저장/임포트 중
; UDP 패킷 손실 → 세션 끊김을 유발한다. 20Mbit/s로 제한.
MaxSendRate=0.02

; Radmin(어댑터 MTU 1500, 캡슐화 오버헤드 있음)과 Tailscale(WireGuard 실 경로 1280)
; 양쪽에서 단편화 없이 통과하는 값. 올리지 말 것.
MaxPacketSize=1130

; 기본 5초는 VPN 지터에서 멀쩡한 연결을 끊어버린다.
ConnectionTimeoutPeriod=30

bAutoRepair=True
AutoRepairAttemptLimit=10
EnableTunnel=False
