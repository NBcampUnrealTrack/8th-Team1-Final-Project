; bRequiresPushToTalk=false

[SystemSettings]
net.CurrentHandshakeVersion=2
net.MinHandshakeVersion=2
net.VerifyNetSessionID=0
net.VerifyNetClientID=0

; VOIP 노이즈 게이트 페이드. 단위는 '초'다 (바로 옆 voice.SilenceDetection*는 ms라 헷갈리기 쉽다).
; 엔진 기본값 0.05/0.30은 말 앞이 50ms 페이드인, 뒤가 300ms 페이드아웃돼 목소리가 뭉개져 들린다.
voice.MicNoiseAttackTime=0.03
voice.MicNoiseReleaseTime=0.01

; 노이즈 게이트 임계값(선형 진폭). 엔진 기본 0.08은 약 -22dBFS로, 말소리 피크(-12~-20dBFS)
; 바로 아래까지 올라와 있어 과하다. 화이트노이즈 차단이 목적이므로 노이즈 플로어 위로만 둔다.
; 0.004 = 약 -48dBFS. 인게임 루프백으로 청감 확인한 값.
voice.MicNoiseGateThreshold=0.004

[ConsoleVariables]
; Exercise the same seamless multiplayer travel path in PIE as standalone.
net.AllowPIESeamlessTravel=1
; Light only voxels used by current-frame translucency, preserving lighting resolution and materials.
r.TranslucencyLightingVolume.MarkVoxels=1
; L_Ocean bounded underwater/boat volumes opt into MegaLights; retain full resolution and masked shadows.
r.MegaLights.DownsampleMode=0
r.MegaLights.LightAttenuationFalloff=1.0
r.MegaLights.HardwareRayTracing.EvaluateMaterialMode=1
; Preserve caustic detail while sharing its periodic light function across lights.
r.LightFunctionAtlas.SlotResolution=1024
; Spread gameplay object reachability and gathering across frames.
; The 2 ms reachability budget is soft; explicit full purges still block.
gc.AllowIncrementalReachability=1
gc.IncrementalReachabilityTimeLimit=0.002
gc.AllowIncrementalGather=1
; Thickness presentation rolled back; retain the flat contamination mask.
MD.Solid.Enabled=0
MD.Solid.Prewarm.Enabled=0
net.CurrentHandshakeVersion=2
net.MinHandshakeVersion=2
; UE 5.8: merged Lumen + skylight pre-exposure. Raise when exposure clips (warning on black viewport).
r.EyeAdaptation.CachedLightingPreExposure=8.0
r.EyeAdaptationQuality=0

