; Multi-User Editing (Concert) 동기화 설정
;
; UConcertSyncConfig 는 UCLASS(config=ConcertSyncCore) 라서 이 파일이 아니면 읽히지 않는다.
; DefaultEngine.ini 에 같은 섹션을 넣으면 조용히 무시되므로 옮기지 말 것.
;
; 네트워크(UdpMessaging) 쪽 튜닝은 Config/DefaultEngine.ini 에 있다.

[/Script/ConcertSyncCore.ConcertSyncConfig]

; 액터를 드래그하는 동안 초당 몇 번 중간 상태를 전송할지. 기본 30은 LAN 기준이고
; Radmin VPN에서는 드래그 한 번에 대역폭이 터진다.
SnapshotTransactionsPerSecond=10

; 다른 사람이 저장한 에셋이 내 로컬 수정본을 말없이 덮어쓰는 것을 막는다.
; 끄면 경고 없이 clobber 된다.
bInteractiveHotReload=True

; AI 에이전트/자동화가 만드는 임시 산출물은 세션에 올리지 않는다.
; 에이전트는 중간 결과물을 /Game/_AgentScratch 아래에 만들기로 약속되어 있다
; (Tools/MultiUser/mu_guard.py 의 SCRATCH_PATH 와 같은 값이어야 한다).
; FPackageClassFilter = { AssetClass, ContentPaths } — AssetClass 를 비우면
; 해당 경로의 모든 에셋 타입이 걸린다.
+ExcludePackageClassFilters=(ContentPaths=("/Game/_AgentScratch"))
